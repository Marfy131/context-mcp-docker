# ContextMCP Server with Docker Compose.
# Supports 100% LOCAL offline operation (Qdrant + Ollama in Docker, CPU-only,
# model pulled automatically) or Cloud (Pinecone + OpenAI/Gemini).
#
# Quick Start (100% Local Offline, nothing to install besides Docker):
#   cp .env.example .env
#   docker compose up --build -d
#
# First `up` also downloads the embedding model (nomic-embed-text, ~274 MB)
# into the ollama_models volume; the server starts only after the pull finishes.
#
# Endpoints:
#   MCP:    http://localhost:8787/mcp
#   Search: http://localhost:8787/search
#   Health: http://localhost:8787/health
#   Qdrant: http://localhost:6333/dashboard
#   Ollama: http://localhost:11434

services:
  server:
    build: .
    image: contextmcp-server
    container_name: contextmcp-server
    restart: unless-stopped
    ports:
      - '${PORT:-8787}:${PORT:-8787}'
    # Kept so OLLAMA_BASE_URL=http://host.docker.internal:11434 can still reach
    # a host-installed Ollama (e.g. for GPU acceleration) if you override the default.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      # --- Server ---
      PORT: ${PORT:-8787}
      SERVER_NAME: ${SERVER_NAME:-contextmcp}
      SERVER_DESCRIPTION: ${SERVER_DESCRIPTION:-Search documentation}

      # --- Vector Database (qdrant | pinecone) ---
      VECTOR_DB_PROVIDER: ${VECTOR_DB_PROVIDER:-qdrant}

      # Qdrant (100% local default)
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-docs}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # Pinecone (cloud alternative)
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-}

      # --- Embedding provider (must match how the index was built) ---
      # For 100% local, use 'ollama' with 'nomic-embed-text' (768 dims)
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}

      # Ollama Base URL:
      # - 'http://ollama:11434' (default) uses the containerized Ollama service below
      # - 'http://host.docker.internal:11434' uses Ollama installed on the host (GPU)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}

      # Optional: point the 'openai' embedding provider at any OpenAI-compatible
      # endpoint (vLLM, llama.cpp, LM Studio, ...). The OpenAI SDK reads
      # OPENAI_BASE_URL automatically. Unauthenticated endpoints work — set
      # OPENAI_API_KEY to a placeholder like 'local' (validation requires non-empty).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}

      # --- Search tuning ---
      DEFAULT_TOP_K: ${DEFAULT_TOP_K:-10}
      MAX_TOP_K: ${MAX_TOP_K:-20}
      # Local setups disable rerank by default since Pinecone rerank is cloud-only
      ENABLE_RERANK: ${ENABLE_RERANK:-false}
      RERANK_MODEL: ${RERANK_MODEL:-pinecone-rerank-v0}
      RERANK_FETCH_COUNT: ${RERANK_FETCH_COUNT:-30}
      MAX_RERANK_CHARS: ${MAX_RERANK_CHARS:-1200}

  # --- Local Vector Database (Qdrant) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: contextmcp-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_storage:/qdrant/storage

  # --- Local Embedding Service (Ollama, CPU by default) ---
  # The stock image ships the CPU runner; without the NVIDIA Container Toolkit
  # on the host it always runs on CPU — nothing to install. To use a
  # host-installed Ollama with GPU instead, set in .env:
  #   OLLAMA_BASE_URL=http://host.docker.internal:11434
  ollama:
    image: ollama/ollama:latest
    container_name: contextmcp-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # --- One-shot embedding-model pull ---
  # Waits for Ollama to be healthy, downloads the model into the shared volume,
  # then exits. Re-running `up` is a fast no-op once the model is present.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: contextmcp-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
    entrypoint: ['/bin/sh', '-c', 'ollama pull "$${OLLAMA_EMBED_MODEL}"']
    restart: 'no'

volumes:
  qdrant_storage:
  ollama_models:
